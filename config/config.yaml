# ==============================================================================
# Configuration: Packera Species Delimitation & Morphometrics Pipeline
# Affiliation: University of North Carolina at Chapel Hill Herbarium (NCU)
# ==============================================================================

# Core Filesystem Paths (relative to project root)
paths:
  workspace_root: "."
  db_path: "data/packera_pipeline.sqlite"
  raw_vouchers_dir: "data/raw_vouchers"
  curated_vouchers_csv: "data/tables/curated_vouchers.csv"
  failed_qc_vouchers_csv: "data/tables/failed_qc_vouchers.csv"
  extraction_manifest_csv: "data/tables/dataset_manifest.csv"
  contours_dir: "data/contours"
  masks_dir: "data/masks"
  leaf_efa_harmonics_csv: "data/tables/leaf_efa_harmonics.csv"
  morphometric_flags_csv: "data/tables/morphometric_flags.csv"
  cda_biplot_pdf: "outputs/figures/Figure_Integrative_Packera_Revision.pdf"
  revision_report_md: "outputs/reports/Packera_Taxonomic_Revision_Summary.md"
  gmm_report_csv: "outputs/reports/gmm_bayes_factors_summary.csv"
  summary_log: "outputs/reports/voucher_ingestion_summary.log"
  model_weights: "LeafMachine2/leafmachine2/segmentation/models/Group3_Dataset_100000_Iter_1176PTS_512Batch_smooth_l1_LR00025_BGR/model_final.pth"
  quarantine_dir: "data/raw_vouchers_quarantine"
  tables_dir: "data/tables"
  figures_dir: "outputs/figures"
  models_dir: "models"

# Model Checkpoints & Remote Artifacts
# Note: The pipeline uses stock LeafMachine2 v2.2+ PLANT_LeafPriority weights by default without requiring custom fine-tuned PCD checkpoints.
models:
  pcd_weights_path: "LeafMachine2/leafmachine2/segmentation/models/Group3_Dataset_100000_Iter_1176PTS_512Batch_smooth_l1_LR00025_BGR/model_final.pth"
  pcd_weights_url: "" # Stock LeafMachine2 v2.2+ PLANT_LeafPriority weights are used by default without requiring custom fine-tuned PCD checkpoints
  pcd_weights_sha256: "" # Optional checksum verification

# Target Focal Taxa, Synonyms, and Outgroups (empty = dynamic genus-wide Packera discovery via GBIF)
taxa:
  target_species: []
  synonyms: {}
  outgroups: []

# Backward compatibility: Target focal taxa (empty = dynamic genus-wide Packera discovery)
taxonomy:
  target_taxa: []

# Pipeline Quality & Morphological Thresholds
thresholds:
  # Standard baseline gatekeepers (existing)
  pcd_conf: 0.72
  minimum_confidence_threshold: 0.65
  min_ucs: 0.85
  min_solidity: 0.72
  min_circularity: 0.25
  min_extent: 0.35
  min_blade_area_cm2: 0.75
  max_tissue_border_ratio: 0.15
  cleanlab_cutoff: 0.85
  min_megapixels: 8.0
  min_file_size_kb: 500.0
  min_sharpness_laplacian: 80.0
  max_uncertainty_meters: 5000.0
  western_longitude_threshold: -106.65
  geographic_scope: "eastern_na"
  countries:
    - "US"

  # Empirical fold-detection parameters (calibrated)
  fold_detection:
    enabled: true
    max_folded_aspect_ratio: 0.42
    max_chord_deviation_ratio: 0.035
    min_chord_length_px: 150

  # Empirical dissection & lyrate sinus parameters (calibrated)
  dissection:
    enabled: true
    min_solidity_dissected: 0.50
    sinus_defect_min_depth_ratio: 0.08
    min_bilateral_sinus_count: 3

  # Strict active/passive reference split & Dawid-Skene empirical precision weights (Slenker et al. 2022; Dawid & Skene 1979)
  # Tier_3_Bronze has weight 0.0 (passive projection only); Tier_1_Gold and Tier_2_Silver are weighted 1.0
  # (after within-taxon Mahalanobis outlier pruning at chi-square 0.95) or by empirical Dawid-Skene precision (w_k = 1 - error_rate_k).
  authority_weights:
    mode: "dawid_skene_or_equal_active"
    mahalanobis_pruning_chisq_quantile: 0.95
    tier_1_gold: 1.0
    tier_2_silver: 1.0
    tier_3_bronze: 0.0

  # Visual capitulum phenological biomarker classification
  capitulum_phenology:
    min_pappus_luminance: 75
    max_pappus_saturation: 0.18
    min_pappus_area_ratio: 0.18
    min_floret_yellow_saturation: 0.32
    min_floret_yellow_ratio: 0.12
    min_anthesis_heads_for_flowering: 1

# Phase 1: Voucher Harvesting & Quality Filtering
harvesting:
  max_records_per_taxon: 5000
  max_uncertainty_meters: 5000.0
  geographic_scope: "eastern_na"
  countries:
    - "US"
  exclude_western: true
  western_longitude_threshold: -106.65
  home_herbarium: "NCU"
  min_megapixels: 8.0
  min_file_size_kb: 500.0
  min_sharpness_laplacian: 80.0
  download_concurrency: 15

# Phase 2: PointRend Segmentation & Geometric Leaf Extraction
segmentation:
  model_weights: "LeafMachine2/leafmachine2/segmentation/models/Group3_Dataset_100000_Iter_1176PTS_512Batch_smooth_l1_LR00025_BGR/model_final.pth"
  detector_version: "PLANT_LeafPriority"
  minimum_confidence_threshold: 0.65
  treat_leaflet_as_leaf_whole: false
  use_efds_for_png_masks: false
  do_apply_landmarks: false
  score_thresh: 0.35
  min_ucs: 0.85
  min_solidity: 0.72
  min_circularity: 0.25
  min_extent: 0.35
  min_blade_area_cm2: 0.75
  max_tissue_border_ratio: 0.15
  max_petiole_width_ratio: 0.105
  cordate_guard_width_ratio: 0.165
  device: "cuda"

# Empirical LeafMachine2 v2.2+ Component Detector & Segmentation Settings (Weaver & Smith 2023/2024)
plant_component_detector:
  detector_version: "PLANT_LeafPriority"
  minimum_confidence_threshold: 0.65

leaf_segmentation:
  treat_leaflet_as_leaf_whole: false
  use_efds_for_png_masks: false
  do_apply_landmarks: false

# Phase 3: Elliptic Fourier Analysis & Statistical Morphometrics (Momocs / MorphoTools2)
morphometrics:
  nb_harmonics: 12
  symmetrize_efa_harmonics: true
  correct_allometry: "auto"
  allometry_r2_threshold: 0.10
  harmonics: 12
  num_pcs: 5
  max_k: 8
  random_seed: 42
  normalization:
    align_major_axis: true
    scale_invariant: true
    rotation_invariant: true
    start_point_invariant: true

# Phase 6: Macroecology & Phenological Spatial Statistics
macroecology:
  phenology:
    min_flowering_doy: 60
    max_flowering_doy: 220
    robust_regression: true

