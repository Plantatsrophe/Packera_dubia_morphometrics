# ==============================================================================
# Configuration: Packera Species Delimitation & Morphometrics Pipeline
# Affiliation: University of North Carolina at Chapel Hill Herbarium (NCU)
# ==============================================================================

# Core Filesystem Paths (relative to project root)
paths:
  workspace_root: "."
  # Central transactional SQLite database (WAL mode) housing Tier A shared entities (vouchers, plant_individuals,
  # extracted_leaves, voucher_reproductive_phenology, environmental_cache + R*Tree) and
  # Tier B run-scoped analyses (pipeline_runs, run_active_cohort, leaf_efa_harmonics, otu_morphometrics,
  # spatial_rf_predictions, curation_triage, v_integrative_triage_master).
  db_path: "data/packera_pipeline.sqlite"
  raw_vouchers_dir: "data/raw_vouchers"
  curated_vouchers_csv: "data/tables/curated_vouchers.csv"
  failed_qc_vouchers_csv: "data/tables/failed_qc_vouchers.csv"
  extraction_manifest_csv: "data/tables/dataset_manifest.csv"
  contours_dir: "data/contours"
  masks_dir: "data/masks"
  leaf_efa_harmonics_csv: "data/tables/leaf_efa_harmonics.csv"
  morphometric_flags_csv: "data/tables/morphometric_flags.csv"
  cda_biplot_pdf: "outputs/figures/Figure_Integrative_Packera_Revision.pdf"
  revision_report_md: "outputs/reports/Packera_Taxonomic_Revision_Summary.md"
  gmm_report_csv: "outputs/reports/gmm_bayes_factors_summary.csv"
  summary_log: "outputs/reports/voucher_ingestion_summary.log"
  lm3_root: "LeafMachine3"
  models_dir: "models/lm3"
  model_weights: "models/lm3/lm3_leaf_segmenter__yolo26x_seg_1024.onnx"
  quarantine_dir: "data/raw_vouchers_quarantine"
  tables_dir: "data/tables"
  figures_dir: "outputs/figures"

# Model Checkpoints & Remote Artifacts
# Note: The pipeline uses pinned LeafMachine3 ONNX models by default.
models:
  lm3_root: "LeafMachine3"
  models_dir: "models/lm3"
  plant_detector_model: "lm3_plant_detector__yolo26x_det_1280"
  archival_detector_model: "lm3_archival_detector__yolo26x_det_1280"
  specimen_segmenter_model: "lm3_specimen_segmenter__unetpp_effb7_1024_dinov3_vith16plus_2048_selftrain"
  leaf_segmenter_model: "lm3_leaf_segmenter__yolo26x_seg_1024"
  landmark_detector_model: "lm3_landmark_detector__yolo26x_pose_640"
  mp_conversion_model: "lm3_mp_conversion_factor__sqrt_fit"
  pcd_weights_path: "models/lm3/lm3_plant_detector__yolo26x_det_1280.onnx"
  pcd_weights_url: "" # Pinned LeafMachine3 ONNX models are used by default
  pcd_weights_sha256: "" # Optional checksum verification

# Target Focal Taxa, Synonyms, and Outgroups (empty = dynamic genus-wide Packera discovery via GBIF)
taxa:
  target_species: []
  synonyms: {}
  outgroups: []

# Backward compatibility: Target focal taxa (empty = dynamic genus-wide Packera discovery)
taxonomy:
  target_taxa: []

# Pipeline Quality & Morphological Thresholds
thresholds:
  # Standard baseline gatekeepers (existing)
  pcd_conf: 0.25
  minimum_confidence_threshold: 0.65
  min_ucs: 0.85
  min_solidity: 0.72
  min_circularity: 0.25
  min_extent: 0.35
  min_blade_area_cm2: 0.75
  max_tissue_border_ratio: 0.15
  min_megapixels: 8.0
  min_file_size_kb: 500.0
  min_sharpness_laplacian: 80.0
  max_uncertainty_meters: 5000.0
  western_longitude_threshold: -98.0
  geographic_scope: "eastern_na"
  countries:
    - "US"

  # Empirical fold-detection parameters (calibrated)
  fold_detection:
    enabled: true
    max_folded_aspect_ratio: 0.42
    max_chord_deviation_ratio: 0.035
    min_chord_length_px: 150

  # Empirical dissection & lyrate sinus parameters (calibrated)
  dissection:
    enabled: true
    min_solidity_dissected: 0.50
    sinus_defect_min_depth_ratio: 0.08
    min_bilateral_sinus_count: 3

  # Strict active/passive reference split & Dawid-Skene empirical precision weights (Slenker et al. 2022; Dawid & Skene 1979)
  # Tier_3_Bronze has weight 0.0 (passive projection only); Tier_1_Gold and Tier_2_Silver are weighted 1.0
  # (after within-taxon Mahalanobis outlier pruning at chi-square 0.95) or by empirical Dawid-Skene precision (w_k = 1 - error_rate_k).
  authority_weights:
    mode: "dawid_skene_or_equal_active"
    mahalanobis_pruning_chisq_quantile: 0.95
    tier_1_gold: 1.0
    tier_2_silver: 1.0
    tier_3_bronze: 0.0

  # Visual capitulum phenological biomarker classification
  capitulum_phenology:
    min_pappus_luminance: 75
    max_pappus_saturation: 0.18
    min_pappus_area_ratio: 0.18
    min_floret_yellow_saturation: 0.32
    min_floret_yellow_ratio: 0.12
    min_anthesis_heads_for_flowering: 1

# Phase 1: Voucher Harvesting & Quality Filtering
harvesting:
  max_records_per_taxon: 5000
  max_uncertainty_meters: 5000.0
  geographic_scope: "eastern_na"
  countries:
    - "US"
  exclude_western: true
  western_longitude_threshold: -98.0
  home_herbarium: "NCU"
  min_megapixels: 8.0
  min_file_size_kb: 500.0
  min_sharpness_laplacian: 80.0
  download_concurrency: 15

# Phase 2: LeafMachine3 Segmentation & Geometric Leaf Extraction
# Cohort-adaptive mode derives empirical organ geometry bounds from verified Gold/Silver
# anchors when N_anchor >= min_anchor_n_for_empirical (5); scalar thresholds below serve
# as physical safety bounds and low-sample fallbacks when N_anchor < 5.
segmentation:
  cohort_adaptive_mode: true
  min_anchor_n_for_empirical: 5
  lm3_root: "LeafMachine3"
  models_dir: "models/lm3"
  model_weights: "models/lm3/lm3_leaf_segmenter__yolo26x_seg_1024.onnx"
  plant_detector_model: "lm3_plant_detector__yolo26x_det_1280"
  archival_detector_model: "lm3_archival_detector__yolo26x_det_1280"
  specimen_segmenter_model: "lm3_specimen_segmenter__unetpp_effb7_1024_dinov3_vith16plus_2048_selftrain"
  leaf_segmenter_model: "lm3_leaf_segmenter__yolo26x_seg_1024"
  landmark_detector_model: "lm3_landmark_detector__yolo26x_pose_640"
  mp_conversion_model: "lm3_mp_conversion_factor__sqrt_fit"
  detector_version: "lm3_plant_detector__yolo26x_det_1280"
  max_working_dim: 3200
  specimen_max_working_dim: 3200
  paperclean: true
  llr_hyst_keep_blobs: true
  paperclean_llr_hyst_keepblobs: true
  subtract_holes: true
  use_cf_predicted_by_mp: true
  ect_num_dirs: 360
  minimum_confidence_threshold: 0.50
  treat_leaflet_as_leaf_whole: false
  use_efds_for_png_masks: false
  do_apply_landmarks: true
  segment_partial_leaves: true
  score_thresh: 0.25
  min_ucs: 0.85
  min_solidity: 0.72
  min_circularity: 0.25
  min_extent: 0.35
  min_blade_area_cm2: 0.75
  min_blade_area_floor_cm2: 0.15
  rosette_plant_bbox_lower_fraction: 0.60
  max_tissue_border_ratio: 0.15
  max_petiole_width_ratio: 0.105
  cordate_guard_width_ratio: 0.165
  device: "cuda"

# Empirical LeafMachine3 Component Detector & Segmentation Settings
plant_component_detector:
  detector_version: "lm3_plant_detector__yolo26x_det_1280"
  plant_detector_model: "lm3_plant_detector__yolo26x_det_1280"
  archival_detector_model: "lm3_archival_detector__yolo26x_det_1280"
  minimum_confidence_threshold: 0.25
  iou: 0.55
  max_det: 1000
  min_box_area: 16
  include_partial: true

leaf_segmentation:
  leaf_segmenter_model: "lm3_leaf_segmenter__yolo26x_seg_1024"
  specimen_segmenter_model: "lm3_specimen_segmenter__unetpp_effb7_1024_dinov3_vith16plus_2048_selftrain"
  landmark_detector_model: "lm3_landmark_detector__yolo26x_pose_640"
  mp_conversion_model: "lm3_mp_conversion_factor__sqrt_fit"
  max_working_dim: 3200
  specimen_max_working_dim: 3200
  paperclean: true
  llr_hyst_keep_blobs: true
  paperclean_llr_hyst_keepblobs: true
  subtract_holes: true
  use_cf_predicted_by_mp: true
  ect_num_dirs: 360
  treat_leaflet_as_leaf_whole: false
  use_efds_for_png_masks: false
  do_apply_landmarks: true
  segment_partial_leaves: true

vision:
  leafmachine3:
    subtract_holes: true
    paperclean_llr_hyst_keepblobs: true
    specimen_max_working_dim: 3200

# Phase 3 & 4: Elliptic Fourier Analysis & Statistical Morphometrics (Momocs / MorphoTools2)
# Cohort-adaptive mode dynamically calibrates EFD harmonic order (A1..D24, >=99% cumulative
# harmonic power within [min_harmonics, max_harmonics]) and retained PCA dimensionality
# (PC1..PC15 / Sym_PC1..Sym_PC15, >=95% variance within [min_export_pcs, max_export_pcs]);
# scalar defaults below act as safety bounds and low-sample fallbacks when N_anchor < 5.
morphometrics:
  cohort_adaptive_mode: true
  min_anchor_n_for_empirical: 5
  nb_harmonics: 12
  symmetrize_efa_harmonics: true
  correct_allometry: "auto"
  allometry_r2_threshold: 0.10
  harmonics: 12
  num_pcs: 5
  max_k: 8
  random_seed: 42
  fourier:
    cohort_adaptive_mode: true
    min_anchor_n_for_empirical: 5
    min_harmonics: 6
    max_harmonics: 24
    target_harmonic_power: 0.99
    target_pca_variance: 0.95
    min_export_pcs: 5
    max_export_pcs: 15
  gmm:
    cohort_adaptive_mode: true
    min_anchor_n_for_empirical: 5
  normalization:
    align_major_axis: true
    scale_invariant: true
    rotation_invariant: true
    start_point_invariant: true

# Phase 6: Macroecology, 19-Variable Bioclimatic/Edaphic Spatial RF & Hopkins Phenology
# Cohort-adaptive mode derives empirical flowering DOY/latitude envelopes and prunes
# collinear predictors (|r| < cor_threshold, VIF < vif_threshold) across all 19 WorldClim
# bioclimatic rasters and 0-15 cm rhizosphere/outcrop layers when N_anchor >= 5; configured
# bounds below act as safety floors/ceilings and low-sample fallbacks when N_anchor < 5.
macroecology:
  cohort_adaptive_mode: true
  min_anchor_n_for_empirical: 5
  phenology:
    cohort_adaptive_mode: true
    min_anchor_n_for_empirical: 5
    min_flowering_doy: 60
    max_flowering_doy: 220
    min_flowering_lat: 24.0
    max_flowering_lat: 55.0
    robust_regression: true
  spatial_rf:
    cohort_adaptive_mode: true
    min_anchor_n_for_empirical: 5
    cor_threshold: 0.70
    vif_threshold: 5.0
    cumulative_importance_cutoff: 0.85

# Top-level Spatial RF mirror section for direct stage configuration lookup
spatial_rf:
  cohort_adaptive_mode: true
  min_anchor_n_for_empirical: 5
  cor_threshold: 0.70
  vif_threshold: 5.0
  cumulative_importance_cutoff: 0.85

# Phase 7: Integrative Taxonomic Triage & Consensus Decision Matrix
# Cohort-adaptive mode derives empirical Hopkins-adjusted phenological residual cutoffs
# from anchor dispersion when N_anchor >= 5; ecotype_ddoy_cutoff_days (14.0) and
# cryptic_ddoy_cutoff_days (18.0) serve as safety bounds / fallbacks when N_anchor < 5.
triage:
  cohort_adaptive_mode: true
  min_anchor_n_for_empirical: 5
  ecotype_ddoy_cutoff_days: 14.0
  cryptic_ddoy_cutoff_days: 18.0

synthesis:
  cohort_adaptive_mode: true
  min_anchor_n_for_empirical: 5
  ecotype_ddoy_cutoff_days: 14.0
  cryptic_ddoy_cutoff_days: 18.0

# Compute & Parallel Execution Controls
# Governed by CLI flags (-j/--threads and --gpu-batch-size) or environment variables
# (PACKERA_MAX_WORKERS and PACKERA_GPU_BATCH_SIZE). Leaving null uses auto-detected
# hardware defaults across Python and R stages.
compute:
  threads: null
  gpu_batch_size: null


