# ==============================================================================
# Configuration: Packera dubia Species Delimitation & Morphometrics Pipeline
# Affiliation: University of North Carolina at Chapel Hill Herbarium (NCU)
# ==============================================================================

# Core Filesystem Paths (relative to project root)
paths:
  workspace_root: "."
  raw_vouchers_dir: "data/raw_vouchers"
  curated_vouchers_csv: "data/tables/curated_vouchers.csv"
  failed_qc_vouchers_csv: "data/tables/failed_qc_vouchers.csv"
  extraction_manifest_csv: "data/tables/dataset_manifest.csv"
  contours_dir: "data/contours"
  masks_dir: "data/masks"
  leaf_efa_harmonics_csv: "data/tables/leaf_efa_harmonics.csv"
  morphometric_flags_csv: "data/tables/morphometric_flags.csv"
  cda_biplot_pdf: "outputs/figures/cda_passive_projection.pdf"
  gmm_report_csv: "outputs/reports/gmm_bayes_factors_summary.csv"
  summary_log: "outputs/reports/voucher_ingestion_summary.log"
  model_weights: "models/lm2_packera_pcd_finetuned.pth"
  quarantine_dir: "data/raw_vouchers_quarantine"
  tables_dir: "data/tables"
  figures_dir: "outputs/figures"
  models_dir: "models"

# Model Checkpoints & Remote Artifacts
models:
  pcd_weights_path: "models/lm2_packera_pcd_finetuned.pth"
  pcd_weights_url: "https://github.com/Plantatsrophe/Packera_dubia_morphometrics/releases/download/v1.0-weights/lm2_packera_pcd_finetuned.pth"
  pcd_weights_sha256: "" # Optional checksum verification

# Target Focal Taxa, Synonyms, and Outgroups
taxa:
  target_species:
    - "Packera dubia"
    - "Packera tomentosa"
    - "Packera anonyma"
    - "Packera plattensis"
    - "Packera paupercula"
  synonyms:
    "Packera dubia":
      - "Senecio tomentosus"
      - "Packera tomentosa"
      - "Cineraria tomentosa"
    "Packera anonyma":
      - "Senecio smallii"
      - "Senecio earlei"
    "Packera paupercula":
      - "Packera paupercula var. savannarum"
      - "Packera paupercula var. pseudotomentosa"
      - "Packera paupercula var. balsamitae"
      - "Packera paupercula var. appalachiana"
      - "Senecio pauperculus"
      - "Senecio balsamitae"
    "Packera plattensis":
      - "Senecio plattensis"
      - "Packera flavovirens"
  outgroups:
    - "Packera glabella"
    - "Packera aurea"
    - "Packera obovata"

# Backward compatibility: Target focal taxa for GBIF & Morphological Demarcation
taxonomy:
  target_taxa:
    - "Packera dubia"
    - "Packera tomentosa"
    - "Senecio tomentosus"
    - "Packera anonyma"
    - "Packera plattensis"
    - "Packera paupercula"

# Pipeline Quality & Morphological Thresholds
thresholds:
  # Standard baseline gatekeepers (existing)
  pcd_conf: 0.72
  min_ucs: 0.85
  min_solidity: 0.72
  cleanlab_cutoff: 0.85
  min_megapixels: 8.0
  min_file_size_kb: 500.0
  min_sharpness_laplacian: 80.0
  max_uncertainty_meters: 5000.0
  western_longitude_threshold: -106.65

  # Empirical fold-detection parameters (calibrated)
  fold_detection:
    enabled: true
    max_folded_aspect_ratio: 0.42
    max_chord_deviation_ratio: 0.035
    min_chord_length_px: 150

  # Empirical dissection & lyrate sinus parameters (calibrated)
  dissection:
    enabled: true
    min_solidity_dissected: 0.50
    sinus_defect_min_depth_ratio: 0.08
    min_bilateral_sinus_count: 3
    taxa_with_lyrate_tendency:
      - "Packera paupercula"
      - "Packera plattensis"
      - "Packera paupercula var. paupercula"
      - "Packera paupercula var. savannarum"

# Phase 1: Voucher Harvesting & Quality Filtering
harvesting:
  max_records_per_taxon: 5000
  max_uncertainty_meters: 5000.0
  exclude_western: true
  western_longitude_threshold: -106.65
  min_megapixels: 8.0
  min_file_size_kb: 500.0
  min_sharpness_laplacian: 80.0
  download_concurrency: 15

# Phase 2: PointRend Segmentation & Geometric Leaf Extraction
segmentation:
  model_weights: "models/lm2_packera_pcd_finetuned.pth"
  score_thresh: 0.40
  min_ucs: 0.85
  min_solidity: 0.72
  device: "cuda"

# Phase 3: Elliptic Fourier Analysis & Statistical Morphometrics (Momocs / MorphoTools2)
morphometrics:
  nb_harmonics: 12
  harmonics: 12
  num_pcs: 5
  max_k: 8
  random_seed: 42
  normalization:
    align_major_axis: true
    scale_invariant: true
    rotation_invariant: true
    start_point_invariant: true
